name: Build and package BCom

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 (.NET 10)
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained Windows x64 build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publishDir = Join-Path $env:RUNNER_TEMP 'bcom-publish'
          dotnet publish .\BCom.csproj -c Release -r win-x64 --self-contained true --output $publishDir -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path (Join-Path $publishDir 'BCom.exe'))) {
            throw 'Missing BCom.exe in publish directory'
          }

      - name: Create portable Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publishDir = Join-Path $env:RUNNER_TEMP 'bcom-publish'
          $distDir = Join-Path $env:GITHUB_WORKSPACE 'dist'

          New-Item -ItemType Directory -Path $distDir -Force | Out-Null
          Get-ChildItem -Path $publishDir -Recurse -File -Filter '*.pdb' | Remove-Item -Force

          $label = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } else {
            "build-$env:GITHUB_RUN_NUMBER"
          }
          $label = $label -replace '[^a-zA-Z0-9._-]', '-'
          $archive = Join-Path $distDir "BCom-$label-win-x64.zip"
          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $archive -Force
          Write-Host "Created $archive"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bcom-win-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged ZIP
        uses: actions/download-artifact@v4
        with:
          name: bcom-win-x64
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/*.zip)
          if (( ${#packages[@]} == 0 )); then
            echo "No package ZIP was produced" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${packages[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${packages[@]}" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
