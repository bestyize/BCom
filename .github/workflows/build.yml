name: Build and release BCom

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release tag name (e.g. v3.2.0, required if publish_release is true)'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create release as draft'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bcom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
          - os: macos-15
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
          - os: ubuntu-24.04
            rid: linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine build version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid version tag: $GITHUB_REF_NAME (expected vMAJOR.MINOR.PATCH)" >&2
              exit 1
            fi
            label="$GITHUB_REF_NAME"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_release }}" == "true" && -n "${{ inputs.tag_name }}" ]]; then
            label="${{ inputs.tag_name }}"
            version="${label#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid version tag: $label (expected vMAJOR.MINOR.PATCH)" >&2
              exit 1
            fi
          else
            version="$(dotnet msbuild BCom.csproj -getProperty:Version)"
            label="build-$GITHUB_RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained application
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish BCom.csproj -c Release -r "${{ matrix.rid }}" \
            --self-contained true --output publish \
            -p:Version="${{ steps.metadata.outputs.version }}" \
            -p:UseAppHost=true -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=true
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -s publish/BCom.exe
          else
            test -s publish/BCom
            chmod +x publish/BCom
          fi
          find publish -type f -name '*.pdb' -delete

      - name: Run serial core regression tests
        shell: bash
        run: dotnet test Tests/BCom.Tests.csproj -c Release --verbosity normal

      - name: Smoke test published CLI
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./publish/BCom.exe --help
          else
            ./publish/BCom --help
          fi

      - name: Smoke test Linux GUI startup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libx11-6 libice6 libsm6 libfontconfig1 >/dev/null
          status=0
          timeout 10s xvfb-run -a ./publish/BCom > startup.log 2>&1 || status=$?
          cat startup.log
          if [[ "$status" -ne 124 ]]; then
            echo "Linux GUI unexpectedly exited (status $status)" >&2
            exit 1
          fi

      - name: Package and verify Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $name = "BCom-${{ steps.metadata.outputs.label }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/* -DestinationPath "dist/$name" -Force
          New-Item -ItemType Directory -Path verify -Force | Out-Null
          Expand-Archive -Path "dist/$name" -DestinationPath verify -Force
          if (!(Test-Path "verify/BCom.exe")) { throw "Packaged BCom.exe is missing" }
          $original = (Get-FileHash publish/BCom.exe -Algorithm SHA256).Hash
          $extracted = (Get-FileHash verify/BCom.exe -Algorithm SHA256).Hash
          if ($original -ne $extracted) { throw "Windows ZIP extraction checksum mismatch" }

      - name: Package and verify macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          BCOM_RID: ${{ matrix.rid }}
          BCOM_VERSION: ${{ steps.metadata.outputs.version }}
          BCOM_LABEL: ${{ steps.metadata.outputs.label }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash .github/scripts/package-macos.sh

      - name: Package and verify Linux tarball
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/BCom dist
          cp -a publish/. package/BCom/
          chmod +x package/BCom/BCom
          tar -czf "dist/BCom-${{ steps.metadata.outputs.label }}-${{ matrix.rid }}.tar.gz" -C package BCom
          mkdir -p verify
          tar -xzf "dist/BCom-${{ steps.metadata.outputs.label }}-${{ matrix.rid }}.tar.gz" -C verify
          test -x verify/BCom/BCom
          cmp -s publish/BCom verify/BCom/BCom

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bcom-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish verified GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true || github.event.inputs.publish_release == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          pattern: bcom-*
          merge-multiple: true
          path: dist

      - name: Validate release assets and write SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" != "tag" && -n "${{ inputs.tag_name }}" ]]; then
            tag="${{ inputs.tag_name }}"
          elif [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            tag="v$(dotnet msbuild BCom.csproj -getProperty:Version)"
          fi

          win=(dist/*-win-x64.zip)
          linux=(dist/*-linux-x64.tar.gz)
          mac_arm=(dist/*-osx-arm64.dmg)
          mac_x64=(dist/*-osx-x64.dmg)

          test -s "${win[0]}"
          test -s "${linux[0]}"
          packages=("${win[0]}" "${linux[0]}")
          unnotarized=(dist/*.unnotarized)
          if (( ${#unnotarized[@]} == 0 )); then
            test -s "${mac_arm[0]}"
            test -s "${mac_x64[0]}"
            packages+=("${mac_arm[0]}" "${mac_x64[0]}")
            echo "MACOS_NOTARIZED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::macOS builds lack Developer ID notarization; DMGs are CI-only, omitted from Release."
            echo "MACOS_NOTARIZED=false" >> "$GITHUB_ENV"
          fi
          ( cd dist && for file in "${packages[@]}"; do sha256sum "${file##*/}"; done ) > dist/SHA256SUMS.txt
          printf '%s\n' "${packages[@]}" >> "$GITHUB_STEP_SUMMARY"
          echo "ASSET_COUNT=${#packages[@]}" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" != "tag" && -n "${{ inputs.tag_name }}" ]]; then
            tag="${{ inputs.tag_name }}"
          elif [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            tag="v$(dotnet msbuild BCom.csproj -getProperty:Version)"
          fi

          BCOM_TAG="$tag" bash .github/scripts/generate-release-notes.sh

          win=(dist/*-win-x64.zip)
          linux=(dist/*-linux-x64.tar.gz)
          mac_arm=(dist/*-osx-arm64.dmg)
          mac_x64=(dist/*-osx-x64.dmg)
          packages=("${win[0]}" "${linux[0]}")
          if [[ "$MACOS_NOTARIZED" == "true" ]]; then
            packages+=("${mac_arm[0]}" "${mac_x64[0]}")
          fi
          packages+=("dist/SHA256SUMS.txt")
          extra_args=()
          if [[ "${{ inputs.draft }}" == "true" ]]; then extra_args+=(--draft); fi
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then extra_args+=(--prerelease); fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${packages[@]}" --clobber
            gh release edit "$tag" --notes-file dist/RELEASE_NOTES.md "${extra_args[@]}"
          else
            gh release create "$tag" "${packages[@]}" \
              --title "BCom $tag" \
              --notes-file dist/RELEASE_NOTES.md \
              --generate-notes \
              "${extra_args[@]}"
          fi
